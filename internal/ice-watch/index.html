<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ICE Watch</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0f0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ICE Watch">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAX-tD46t58DUcvCXggMRLENq74iweWfw0&libraries=places,visualization"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:#0f0f0f; color:#f1f1f1; font-family:'Inter',-apple-system,sans-serif; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }

  /* TOP BAR */
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:#0f0f0f; border-bottom:1px solid #1f1f1f; flex-shrink:0; z-index:100; }
  .logo { display:flex; align-items:center; gap:8px; }
  .logo-icon { font-size:20px; }
  .logo-text { font-size:16px; font-weight:700; color:#fff; }
  .logo-badge { background:#dc2626; color:#fff; font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; }
  .topbar-right { display:flex; gap:8px; align-items:center; }
  .lang-toggle { display:flex; background:#1a1a1a; border:1px solid #2a2a2a; border-radius:20px; overflow:hidden; }
  .lang-btn { padding:4px 12px; font-size:11px; font-weight:700; border:none; background:transparent; color:#6b7280; cursor:pointer; transition:all 0.2s; }
  .lang-btn.active { background:#dc2626; color:#fff; border-radius:18px; }
  .report-btn { background:#dc2626; color:#fff; font-size:12px; font-weight:700; padding:7px 14px; border:none; border-radius:20px; cursor:pointer; display:flex; align-items:center; gap:4px; }

  /* MAP */
  #map { flex:1; width:100%; }

  /* BOTTOM SHEET */
  .sheet { position:fixed; bottom:0; left:0; right:0; background:#111; border-radius:20px 20px 0 0; border-top:1px solid #2a2a2a; transform:translateY(100%); transition:transform 0.35s cubic-bezier(.32,.72,0,1); z-index:200; max-height:90dvh; overflow-y:auto; }
  .sheet.open { transform:translateY(0); }
  .sheet-handle { width:40px; height:4px; background:#333; border-radius:2px; margin:12px auto 0; }
  .sheet-title { font-size:16px; font-weight:700; padding:14px 20px 0; }
  .sheet-body { padding:16px 20px 40px; display:flex; flex-direction:column; gap:14px; }

  /* SEARCH BAR */
  .search-wrap { padding:10px 14px; background:#0f0f0f; flex-shrink:0; }
  .search-input { width:100%; background:#1a1a1a; border:1px solid #2a2a2a; color:#fff; font-size:14px; padding:10px 16px; border-radius:12px; outline:none; font-family:inherit; }
  .search-input:focus { border-color:#dc2626; }
  .search-input::placeholder { color:#4b5563; }

  /* FORM */
  .form-label { font-size:12px; color:#6b7280; font-weight:600; margin-bottom:5px; display:block; }
  .form-select, .form-input, .form-textarea {
    width:100%; background:#1a1a1a; border:1px solid #2a2a2a; color:#fff;
    font-size:15px; padding:13px 16px; border-radius:12px; outline:none;
    font-family:inherit; appearance:none;
  }
  .form-select:focus, .form-input:focus, .form-textarea:focus { border-color:#dc2626; }
  .form-textarea { resize:none; height:80px; font-size:14px; }
  .form-hint { font-size:11px; color:#4b5563; margin-top:5px; }
  .submit-btn { background:#dc2626; color:#fff; font-size:16px; font-weight:700; padding:16px; border-radius:14px; border:none; cursor:pointer; width:100%; margin-top:4px; }
  .submit-btn:active { opacity:0.85; }
  .cancel-btn { background:transparent; color:#6b7280; font-size:14px; border:none; cursor:pointer; padding:8px; text-align:center; width:100%; }

  /* FEED */
  .feed-item { background:#1a1a1a; border-radius:14px; padding:14px 16px; border-left:3px solid #dc2626; }
  .feed-type { font-size:14px; font-weight:700; margin-bottom:3px; }
  .feed-loc { font-size:12px; color:#9ca3af; }
  .feed-time { font-size:11px; color:#4b5563; margin-top:4px; }
  .feed-desc { font-size:12px; color:#d1d5db; margin-top:6px; line-height:1.5; }
  .feed-empty { text-align:center; color:#4b5563; font-size:14px; padding:30px 0; }

  /* BOTTOM NAV */
  .bottomnav { display:flex; background:#0f0f0f; border-top:1px solid #1f1f1f; flex-shrink:0; }
  .nav-item { flex:1; display:flex; flex-direction:column; align-items:center; padding:10px 0 14px; gap:3px; cursor:pointer; border:none; background:transparent; color:#4b5563; font-size:10px; font-weight:600; transition:color 0.2s; }
  .nav-item.active { color:#dc2626; }
  .nav-icon { font-size:20px; }

  /* OVERLAY */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:150; display:none; }
  .overlay.show { display:block; }

  /* TOAST */
  .toast { position:fixed; top:70px; left:50%; transform:translateX(-50%) translateY(-20px); background:#1f2937; color:#fff; padding:10px 20px; border-radius:20px; font-size:13px; font-weight:600; opacity:0; transition:all 0.3s; z-index:999; white-space:nowrap; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* PIN DROP indicator */
  .pin-mode-banner { position:fixed; top:70px; left:50%; transform:translateX(-50%); background:#dc2626; color:#fff; padding:9px 20px; border-radius:20px; font-size:13px; font-weight:700; z-index:300; display:none; box-shadow:0 4px 20px rgba(220,38,38,0.4); }
  .pin-mode-banner.show { display:block; }

  /* Count badge */
  #report-count { font-size:11px; background:#dc2626; color:#fff; border-radius:10px; padding:1px 6px; margin-left:4px; }

  /* pac-container (Places autocomplete) styling */
  .pac-container { background:#1a1a1a !important; border:1px solid #2a2a2a !important; border-radius:12px !important; margin-top:4px; box-shadow:0 8px 30px rgba(0,0,0,0.5) !important; font-family:inherit !important; }
  .pac-item { background:#1a1a1a !important; color:#d1d5db !important; padding:10px 14px !important; border-top:1px solid #2a2a2a !important; cursor:pointer; font-size:13px !important; }
  .pac-item:hover, .pac-item-selected { background:#252525 !important; }
  .pac-item-query { color:#fff !important; font-size:13px !important; }
  .pac-icon { display:none !important; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <span class="logo-icon">🛡️</span>
    <span class="logo-text">ICE Watch</span>
    <span class="logo-badge" id="report-count">0</span>
  </div>
  <div class="topbar-right">
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="report-btn" onclick="startReport()">+ <span data-es="Reportar" data-en="Report">Reportar</span></button>
  </div>
</div>

<div class="search-wrap">
  <input type="text" id="city-search" class="search-input"
    placeholder="Buscar ciudad... / Search city..." autocomplete="off">
</div>

<div id="map"></div>

<nav class="bottomnav">
  <button class="nav-item active" id="nav-map" onclick="switchTab('map')">
    <span class="nav-icon">🗺️</span>
    <span data-es="Mapa" data-en="Map">Mapa</span>
  </button>
  <button class="nav-item" id="nav-feed" onclick="switchTab('feed')">
    <span class="nav-icon">📋</span>
    <span data-es="Reportes" data-en="Reports">Reportes</span>
  </button>
  <button class="nav-item" id="nav-share" onclick="shareApp()">
    <span class="nav-icon">📤</span>
    <span data-es="Compartir" data-en="Share">Compartir</span>
  </button>
</nav>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="closeSheet()"></div>

<!-- PIN MODE BANNER -->
<div class="pin-mode-banner" id="pin-banner">
  📍 <span data-es="Toca el mapa para marcar el lugar" data-en="Tap map to pin location">Toca el mapa para marcar el lugar</span>
</div>

<!-- REPORT SHEET -->
<div class="sheet" id="report-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">
    <span data-es="🚨 Nuevo Reporte" data-en="🚨 New Report">🚨 Nuevo Reporte</span>
  </div>
  <div class="sheet-body">
    <div>
      <label class="form-label"><span data-es="Tipo de actividad" data-en="Activity type">Tipo de actividad</span></label>
      <select id="activity-type" class="form-select">
        <option value="Redada">🚔 Redada / Raid</option>
        <option value="Checkpoint">🛑 Checkpoint</option>
        <option value="Agentes">👮 Agentes vistos / Agents spotted</option>
        <option value="Vehiculos">🚗 Vehículos sospechosos / Suspicious vehicles</option>
        <option value="Otro">❓ Otro / Other</option>
      </select>
    </div>
    <div>
      <label class="form-label"><span data-es="Ubicación" data-en="Location">Ubicación</span></label>
      <input type="text" id="location-input" class="form-input"
        placeholder="Escribe una dirección o toca el mapa..."
        autocomplete="off">
      <p class="form-hint" id="coords-hint">— <span data-es="o toca el mapa para fijar el pin" data-en="or tap the map to drop a pin">o toca el mapa para fijar el pin</span></p>
    </div>
    <div>
      <label class="form-label"><span data-es="Descripción (opcional)" data-en="Description (optional)">Descripción (opcional)</span></label>
      <textarea id="description" class="form-textarea" placeholder="..."></textarea>
    </div>
    <button class="submit-btn" onclick="submitReport()">
      <span data-es="Enviar Reporte" data-en="Submit Report">Enviar Reporte</span>
    </button>
    <button class="cancel-btn" onclick="closeSheet()">
      <span data-es="Cancelar" data-en="Cancel">Cancelar</span>
    </button>
  </div>
</div>

<!-- FEED SHEET -->
<div class="sheet" id="feed-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title" style="display:flex;align-items:center;justify-content:space-between;padding-right:20px;">
    <span data-es="Reportes Recientes" data-en="Recent Reports">Reportes Recientes</span>
    <span id="feed-count" style="font-size:12px;color:#6b7280;font-weight:400"></span>
  </div>
  <div class="sheet-body" id="feed-list">
    <p class="feed-empty" data-es="Cargando reportes..." data-en="Loading reports...">Cargando reportes...</p>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const API = 'https://jarvis-2f6f429a.base44.app/api/entities/IceReport';
let map, heatmap, markers = [], infoWins = [], heatData = [];
let pinLat = null, pinLng = null, pinMode = false;
let pendingPin = null;
let lang = localStorage.getItem('ice_lang') || 'es';
let allReports = [];

// ---- LANG ----
function setLang(l) {
  lang = l;
  localStorage.setItem('ice_lang', l);
  document.getElementById('btn-es').classList.toggle('active', l==='es');
  document.getElementById('btn-en').classList.toggle('active', l==='en');
  document.querySelectorAll('[data-es]').forEach(el => {
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
    el.textContent = el.getAttribute('data-' + l);
  });
  document.querySelector('#city-search').placeholder = l === 'es'
    ? 'Buscar ciudad... / Search city...'
    : 'Search city... / Buscar ciudad...';
}

// ---- MAP INIT ----
function initGoogleMap() {
  const usBounds = { north:49.384358, south:24.396308, west:-125.0, east:-66.93457 };
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat:37.8, lng:-96.0 },
    zoom: 4,
    minZoom: 4,
    maxZoom: 16,
    restriction: { latLngBounds: usBounds, strictBounds: false },
    mapTypeId: 'roadmap',
    disableDefaultUI: true,
    zoomControl: true,
    gestureHandling: 'greedy',
    styles: [
      {elementType:"geometry",stylers:[{color:"#111111"}]},
      {elementType:"labels.text.stroke",stylers:[{color:"#111111"}]},
      {elementType:"labels.text.fill",stylers:[{color:"#9ca3af"}]},
      {featureType:"road",elementType:"geometry",stylers:[{color:"#1f1f1f"}]},
      {featureType:"road.highway",elementType:"geometry",stylers:[{color:"#2a2a2a"}]},
      {featureType:"road",elementType:"labels.text.fill",stylers:[{color:"#555"}]},
      {featureType:"water",elementType:"geometry",stylers:[{color:"#0a0a0a"}]},
      {featureType:"water",elementType:"labels.text.fill",stylers:[{color:"#374151"}]},
      {featureType:"poi",stylers:[{visibility:"off"}]},
      {featureType:"transit",stylers:[{visibility:"off"}]},
      {featureType:"administrative.country",elementType:"geometry.stroke",stylers:[{color:"#dc2626"}]},
      {featureType:"administrative.province",elementType:"geometry.stroke",stylers:[{color:"#2a2a2a"}]}
    ]
  });

  heatmap = new google.maps.visualization.HeatmapLayer({
    data: [],
    map: map,
    radius: 50,
    opacity: 0.65,
    gradient: ['rgba(0,0,0,0)','rgba(255,200,0,0.5)','rgba(255,100,0,0.7)','rgba(220,38,38,0.9)']
  });

  map.addListener('click', (e) => {
    if (!pinMode) return;
    pinLat = e.latLng.lat();
    pinLng = e.latLng.lng();
    placeTempPin(pinLat, pinLng);
    reverseGeocode(pinLat, pinLng);
    exitPinMode();
    openSheet('report-sheet');
  });

  // Places autocomplete on city search
  const searchInput = document.getElementById('city-search');
  const autocomplete = new google.maps.places.Autocomplete(searchInput, {
    types: ['(cities)'],
    componentRestrictions: { country: 'us' },
    fields: ['geometry', 'name', 'address_components']
  });
  autocomplete.addListener('place_changed', () => {
    const place = autocomplete.getPlace();
    if (place.geometry) {
      map.panTo(place.geometry.location);
      map.setZoom(11);
    }
    setTimeout(() => { searchInput.value = ''; searchInput.blur(); }, 300);
  });

  // Places autocomplete on location input inside report sheet
  const locInput = document.getElementById('location-input');
  const locAuto = new google.maps.places.Autocomplete(locInput, {
    componentRestrictions: { country: 'us' },
    fields: ['geometry', 'formatted_address', 'address_components']
  });
  locAuto.addListener('place_changed', () => {
    const place = locAuto.getPlace();
    if (place.geometry) {
      pinLat = place.geometry.location.lat();
      pinLng = place.geometry.location.lng();
      placeTempPin(pinLat, pinLng);
      map.panTo(place.geometry.location);
      map.setZoom(13);
      const comps = place.address_components || [];
      const city = comps.find(c=>c.types.includes('locality'))?.long_name || '';
      const state = comps.find(c=>c.types.includes('administrative_area_level_1'))?.short_name || '';
      document.getElementById('coords-hint').querySelector('[data-es]').textContent =
        `📍 ${city}${state ? ', '+state : ''}`;
    }
  });

  loadReports();
}

// ---- TEMP PIN ----
let tempMarker = null;
function placeTempPin(lat, lng) {
  if (tempMarker) tempMarker.setMap(null);
  tempMarker = new google.maps.Marker({
    position: { lat, lng },
    map,
    icon: {
      path: google.maps.SymbolPath.CIRCLE,
      scale: 10,
      fillColor: '#dc2626',
      fillOpacity: 1,
      strokeColor: '#fff',
      strokeWeight: 2
    },
    animation: google.maps.Animation.DROP
  });
}

// ---- GEOCODE ----
function reverseGeocode(lat, lng) {
  new google.maps.Geocoder().geocode({ location: { lat, lng } }, (results, status) => {
    if (status === 'OK' && results[0]) {
      const comps = results[0].address_components;
      const city = comps.find(c=>c.types.includes('locality'))?.long_name ||
                   comps.find(c=>c.types.includes('sublocality'))?.long_name || '';
      const state = comps.find(c=>c.types.includes('administrative_area_level_1'))?.short_name || '';
      document.getElementById('location-input').value = results[0].formatted_address;
      document.getElementById('coords-hint').querySelector('[data-es]').textContent =
        `📍 ${city}${state ? ', '+state : ''}`;
    }
  });
}

// ---- PIN MODE ----
function startPinMode() {
  pinMode = true;
  document.getElementById('pin-banner').classList.add('show');
  closeSheet();
  setTimeout(() => { if(pinMode) exitPinMode(); }, 20000);
}
function exitPinMode() {
  pinMode = false;
  document.getElementById('pin-banner').classList.remove('show');
}

// ---- REPORTS ----
async function loadReports() {
  try {
    const res = await fetch(API + '?limit=200&sort=-created_date', {
      headers: { 'Content-Type': 'application/json' }
    });
    allReports = await res.json();
    if (!Array.isArray(allReports)) allReports = [];
    renderMap();
    renderFeed();
    document.getElementById('report-count').textContent = allReports.filter(r=>r.active!==false).length;
  } catch(e) { console.error(e); }
}

function renderMap() {
  markers.forEach(m => m.setMap(null));
  infoWins.forEach(w => w.close());
  markers = []; infoWins = []; heatData = [];

  const active = allReports.filter(r => r.active !== false);
  active.forEach(r => {
    if (!r.lat || !r.lng) return;
    const lat = parseFloat(r.lat), lng = parseFloat(r.lng);
    heatData.push({ location: new google.maps.LatLng(lat, lng), weight: 1 });

    const iw = new google.maps.InfoWindow({
      content: `<div style="background:#1a1a1a;color:#f1f1f1;padding:10px 12px;border-radius:10px;font-family:-apple-system,sans-serif;min-width:150px;max-width:220px">
        <div style="font-weight:700;color:#dc2626;font-size:13px;margin-bottom:4px">${r.activity_type}</div>
        <div style="font-size:12px;color:#9ca3af">${r.city || ''}${r.state ? ', '+r.state : ''}</div>
        <div style="font-size:11px;color:#4b5563;margin-top:3px">${timeAgo(r.created_date)}</div>
        ${r.description ? `<div style="font-size:12px;color:#d1d5db;margin-top:6px;line-height:1.4">${r.description}</div>` : ''}
      </div>`
    });

    const m = new google.maps.Marker({
      position: { lat, lng }, map,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 9, fillColor:'#dc2626', fillOpacity:0.9,
        strokeColor:'#fff', strokeWeight:1.5
      }
    });
    m.addListener('click', () => {
      infoWins.forEach(w => w.close());
      iw.open(map, m);
    });
    markers.push(m); infoWins.push(iw);
  });
  heatmap.setData(heatData);
}

function renderFeed() {
  const list = document.getElementById('feed-list');
  const active = allReports.filter(r => r.active !== false);
  document.getElementById('feed-count').textContent = active.length + ' reportes';
  if (!active.length) {
    list.innerHTML = `<p class="feed-empty" data-es="Sin reportes aún" data-en="No reports yet">${lang==='es'?'Sin reportes aún':'No reports yet'}</p>`;
    return;
  }
  list.innerHTML = active.slice(0,50).map(r => `
    <div class="feed-item" onclick="flyTo(${r.lat},${r.lng})">
      <div class="feed-type">${r.activity_type}</div>
      <div class="feed-loc">📍 ${r.city || ''}${r.state ? ', '+r.state : ''}</div>
      <div class="feed-time">${timeAgo(r.created_date)}</div>
      ${r.description ? `<div class="feed-desc">${r.description}</div>` : ''}
    </div>`).join('');
}

function flyTo(lat, lng) {
  closeSheet();
  map.panTo({ lat: parseFloat(lat), lng: parseFloat(lng) });
  map.setZoom(13);
}

// ---- REPORT FORM ----
function startReport() {
  pinLat = null; pinLng = null;
  document.getElementById('location-input').value = '';
  document.getElementById('description').value = '';
  document.getElementById('activity-type').selectedIndex = 0;
  document.getElementById('coords-hint').querySelector('[data-es]').textContent =
    lang === 'es' ? 'o toca el mapa para fijar el pin' : 'or tap the map to drop a pin';
  if (tempMarker) { tempMarker.setMap(null); tempMarker = null; }
  openSheet('report-sheet');
}

async function submitReport() {
  const activity_type = document.getElementById('activity-type').value;
  const description = document.getElementById('description').value.trim();
  const locVal = document.getElementById('location-input').value.trim();

  if (!pinLat || !pinLng) {
    showToast(lang==='es' ? '📍 Elige una ubicación primero' : '📍 Choose a location first');
    return;
  }

  const btn = document.querySelector('.submit-btn');
  btn.disabled = true;
  btn.textContent = lang === 'es' ? 'Enviando...' : 'Sending...';

  // Get city/state from geocoder
  let city = '', state = '';
  try {
    await new Promise(resolve => {
      new google.maps.Geocoder().geocode({ location: { lat: pinLat, lng: pinLng } }, (results, status) => {
        if (status === 'OK' && results[0]) {
          const comps = results[0].address_components;
          city = comps.find(c=>c.types.includes('locality'))?.long_name ||
                 comps.find(c=>c.types.includes('sublocality'))?.long_name || '';
          state = comps.find(c=>c.types.includes('administrative_area_level_1'))?.short_name || '';
        }
        resolve();
      });
    });
  } catch(e) {}

  try {
    await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lat: pinLat, lng: pinLng, city, state, activity_type, description, active: true })
    });
    showToast(lang==='es' ? '✅ Reporte enviado. Gracias.' : '✅ Report submitted. Thank you.');
    closeSheet();
    if (tempMarker) { tempMarker.setMap(null); tempMarker = null; }
    await loadReports();
  } catch(e) {
    showToast(lang==='es' ? '❌ Error. Intenta de nuevo.' : '❌ Error. Please try again.');
  }

  btn.disabled = false;
  btn.textContent = lang === 'es' ? 'Enviar Reporte' : 'Submit Report';
}

// ---- TABS ----
function switchTab(tab) {
  ['map','feed','share'].forEach(t => {
    document.getElementById('nav-'+t)?.classList.toggle('active', t===tab);
  });
  if (tab === 'feed') openSheet('feed-sheet');
  else if (tab === 'share') { shareApp(); document.getElementById('nav-map').classList.add('active'); document.getElementById('nav-share').classList.remove('active'); }
  else closeSheet();
}

// ---- SHEETS ----
function openSheet(id) {
  document.querySelectorAll('.sheet').forEach(s => s.classList.remove('open'));
  document.getElementById(id).classList.add('open');
  document.getElementById('overlay').classList.add('show');
}
function closeSheet() {
  document.querySelectorAll('.sheet').forEach(s => s.classList.remove('open'));
  document.getElementById('overlay').classList.remove('show');
  exitPinMode();
  ['map','feed','share'].forEach(t => document.getElementById('nav-'+t)?.classList.remove('active'));
  document.getElementById('nav-map').classList.add('active');
}

// ---- SHARE ----
function shareApp() {
  const url = 'https://jfwebstudios.com/ice-watch/';
  const msg = lang === 'es'
    ? '🛡️ ICE Watch — Reporta y ve actividad migratoria en tiempo real. ' + url
    : '🛡️ ICE Watch — Report and see immigration activity in real time. ' + url;
  if (navigator.share) {
    navigator.share({ title: 'ICE Watch', text: msg, url });
  } else {
    navigator.clipboard?.writeText(url);
    showToast(lang==='es' ? '🔗 Link copiado' : '🔗 Link copied');
  }
}

// ---- HELPERS ----
function timeAgo(date) {
  if (!date) return '';
  const diff = Date.now() - new Date(date).getTime();
  const m = Math.floor(diff/60000);
  if (m < 1) return lang==='es' ? 'ahora mismo' : 'just now';
  if (m < 60) return `${m} ${lang==='es'?'min':'min'} ago`;
  const h = Math.floor(m/60);
  if (h < 24) return `${h}h ago`;
  return `${Math.floor(h/24)}d ago`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ---- INIT ----
window.addEventListener('load', () => {
  setLang(lang);
  initGoogleMap();

  // PWA install prompt
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    const btn = document.createElement('button');
    btn.className = 'report-btn';
    btn.style.cssText = 'background:#1a1a1a;border:1px solid #333;margin-right:4px';
    btn.innerHTML = '📲 Install';
    btn.onclick = () => { deferredPrompt.prompt(); btn.remove(); };
    document.querySelector('.topbar-right').prepend(btn);
  });
});

// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
